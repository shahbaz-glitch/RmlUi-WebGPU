name: Import RmlUi 6.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Clone official RmlUi 6.3
        run: |
          git clone --depth 1 --branch 6.3 https://github.com/mikke89/RmlUi.git /tmp/RmlUi

      - name: Copy RmlUi 6.3 to repository root
        run: |
          find /tmp/RmlUi -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} . \;

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/import-rmlui.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add RmlUi 6.3"
          git push
